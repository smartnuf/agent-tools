[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "smartnuf-agent-tools"
dynamic = ["version"]
description = "Agent workstation capability discovery, diagnostics, and reusable document tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [
    { name = "smartnuf contributors" },
]
keywords = ["agents", "capability-discovery", "developer-tools", "document-processing", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=6.16,<7",
    "pdfplumber>=0.11,<0.12",
    "PyMuPDF>=1.28,<2",
    "Pillow>=12.3,<13",
    "reportlab>=5,<6",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/smartnuf/agent-tools"
Repository = "https://github.com/smartnuf/agent-tools"
Issues = "https://github.com/smartnuf/agent-tools/issues"

[project.scripts]
agent-tools = "agent_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]

[tool.hatch.version]
path = "src/agent_tools/__init__.py"
