[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-tools-local"
version = "0.1.0"
description = "User-level reusable helpers for local coding agents"
requires-python = ">=3.11"

[project.scripts]
agent-tools = "agent_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]
