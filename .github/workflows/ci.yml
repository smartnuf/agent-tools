name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install native tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript

      - name: Install native tools (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler ghostscript

      - name: Install native tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler ghostscript -y --no-progress
          $searchRoots = 'C:\ProgramData\chocolatey\lib', 'C:\Program Files\gs'
          $required = 'pdfinfo.exe', 'pdftotext.exe', 'pdftoppm.exe', 'gswin64c.exe'
          $toolDirectories = foreach ($name in $required) {
            $tool = Get-ChildItem $searchRoots -Filter $name -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $tool) { throw "Chocolatey installed packages but $name was not found." }
            $tool.DirectoryName
          }
          $machineDirectories = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';' | Where-Object { $_ }
          $directories = @($toolDirectories) + @($machineDirectories) | Select-Object -Unique
          foreach ($directory in $directories) {
            $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Bootstrap twice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/bootstrap.ps1
          ./scripts/path.ps1

      - name: Bootstrap twice (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/bootstrap.sh
          sh scripts/bootstrap.sh
          sh scripts/path.sh

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m unittest discover -s tests

      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m unittest discover -s tests

      - name: Test PATH profile handling (Unix)
        if: runner.os != 'Windows'
        run: sh tests/test_path.sh

      - name: Verify installed tools (Windows)
        if: runner.os == 'Windows'
        run: bin\agent-tools.cmd doctor

      - name: Verify installed tools (Unix)
        if: runner.os != 'Windows'
        run: sh bin/agent-tools doctor
